[project]
name = "clip-classifier-service"
version = "0.1.0"
description = "Product-grade OpenCLIP image classification service for DFN5B-CLIP-ViT-H-14-378."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "python-multipart>=0.0.9,<1.0",
  "pillow>=10.3,<11.0",
  "pyyaml>=6.0,<7.0",
  "prometheus-client>=0.20,<1.0",
  "pynacl>=1.5,<2.0",
  "cryptography>=42,<50",
  "open-clip-torch>=2.24,<3.0",
  "torch==2.2.2+cu121",
  "torchvision==0.17.2+cu121",
  "numpy>=1.26,<2.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.2,<9.0",
  "ruff>=0.5,<1.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
